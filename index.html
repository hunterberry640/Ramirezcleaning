<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://www.ramirezcleaningservices.com/en/" />
  <title>Ramirez Cleaning Services</title>
  <script>
    // Detect browser language and redirect accordingly
    const lang = navigator.language.startsWith('es') ? 'es' : 'en';
    // Handle GitHub Pages subdirectory (repo name in path)
    const pathname = window.location.pathname;
    // Remove trailing slash and index.html if present
    const basePath = pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '';
    window.location.replace(`${basePath}/${lang}/`);
  </script>
</head>
<body>
  <p>Redirecting...</p>
  <noscript>
    <p>Please enable JavaScript or visit <a href="en/">English version</a> or <a href="es/">Spanish version</a>.</p>
  </noscript>
</body>
</html>
