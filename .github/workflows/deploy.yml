name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1

jobs:
  deploy:
    name: Terraform + Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf
        working-directory: infra
        run: |
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "dist_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Sync site files to S3
        run: |
          aws s3 sync . "s3://${{ steps.tf.outputs.bucket }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".cursor/*" \
            --exclude "node_modules/*" \
            --exclude "infra/*" \
            --exclude "deploy.sh" \
            --exclude ".gitignore" \
            --exclude "*.md" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "vite.config.js" \
            --exclude ".nojekyll" \
            --exclude "CNAME" \
            --cache-control "public, max-age=86400"

      - name: Set HTML cache headers
        run: |
          aws s3 cp "s3://${{ steps.tf.outputs.bucket }}" "s3://${{ steps.tf.outputs.bucket }}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=300" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.dist_id }}" \
            --paths "/*" \
            --no-cli-pager
